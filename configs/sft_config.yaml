training:
  learning_rate: 0.0002
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 1
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  output_dir: "checkpoints/sft_student"
  fp16: true
  bf16: false

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"

data:
  train_path: "data/processed/train.jsonl"
  val_path: "data/processed/val.jsonl"
  max_seq_length: 1024
