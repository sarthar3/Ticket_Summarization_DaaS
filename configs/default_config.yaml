model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  precision: "float16" # Options: float32, float16, bfloat16, int8, int4
  device: "auto"       # Options: auto, cuda, cpu, mps
  trust_remote_code: true
  fallback_cpu_model: "sshleifer/tiny-gpt2" # Lightweight fallback for CPU unit testing if needed

context:
  max_input_tokens: 1024
  max_output_tokens: 128
  truncation_side: "right"

generation:
  max_new_tokens: 96
  min_new_tokens: 10
  do_sample: false
  temperature: 0.7
  top_p: 0.9
  num_beams: 1
  repetition_penalty: 1.1

prompt:
  template: |
    You are a factual support ticket summarizer. State only direct facts.
    If the customer reports money debited that was 'not done by me', identify it as an unauthorized / fraudulent transaction (never as a deposit or credit delay).
    Summarize this ticket in 1-2 direct sentences without prefixes:

    Ticket:
    {ticket_text}

    Summary:

evaluation:
  rouge_types:
    - "rouge1"
    - "rouge2"
    - "rougeL"
  hourly_hardware_cost_usd: 0.85

reproducibility:
  seed: 42
