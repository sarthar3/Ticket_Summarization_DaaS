model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  precision: "float16" # Options: float32, float16, bfloat16, int8, int4
  device: "auto"       # Options: auto, cuda, cpu, mps
  trust_remote_code: true
  fallback_cpu_model: "sshleifer/tiny-gpt2" # Lightweight fallback for CPU unit testing if needed

context:
  max_input_tokens: 1024
  max_output_tokens: 128
  truncation_side: "right"

generation:
  max_new_tokens: 38
  min_new_tokens: 8
  do_sample: false
  temperature: 0.7
  top_p: 0.9
  num_beams: 1
  repetition_penalty: 1.1

prompt:
  template: |
    You are a factual support ticket summarizer. State only direct facts in 1-2 concise sentences without prefixes:

    Ticket:
    {ticket_text}

    Summary:

clustering:
  similarity_threshold: 0.65
  time_window_minutes: 60
  min_distinct_customers_for_outage: 2

evaluation:
  rouge_types:
    - "rouge1"
    - "rouge2"
    - "rougeL"
  hourly_hardware_cost_usd: 0.85

reproducibility:
  seed: 42
