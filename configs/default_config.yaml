model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  precision: "float16" # Options: float32, float16, bfloat16, int8, int4
  device: "auto"       # Options: auto, cuda, cpu, mps
  trust_remote_code: true
  fallback_cpu_model: "sshleifer/tiny-gpt2" # Lightweight fallback for CPU unit testing if needed

context:
  max_input_tokens: 1024
  max_output_tokens: 256
  truncation_side: "right"

generation:
  max_new_tokens: 256
  min_new_tokens: 10
  do_sample: false
  temperature: 0.7
  top_p: 0.9
  num_beams: 1
  repetition_penalty: 1.1

prompt:
  template: |
    Summarize the following customer support ticket concisely, highlighting the core issue, customer sentiment/intent, and key action items.

    Ticket:
    {ticket_text}

    Summary:

evaluation:
  rouge_types:
    - "rouge1"
    - "rouge2"
    - "rougeL"
  hourly_hardware_cost_usd: 0.85

reproducibility:
  seed: 42
